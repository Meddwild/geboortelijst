<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 250" role="img" aria-label="Een babygiraf">
  <style>
    .head { animation: tilt 5s ease-in-out infinite; transform-origin: 80px 150px; }
    @keyframes tilt { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2.5deg); } }
    @media (prefers-reduced-motion: reduce) { .head { animation: none; } }
  </style>

  <!-- legs -->
  <g fill="#f3c97f">
    <rect x="52" y="196" width="13" height="50" rx="6"/>
    <rect x="95" y="196" width="13" height="50" rx="6"/>
  </g>
  <g fill="#b98455"><rect x="52" y="238" width="13" height="10" rx="4"/><rect x="95" y="238" width="13" height="10" rx="4"/></g>

  <!-- body -->
  <ellipse cx="80" cy="190" rx="44" ry="30" fill="#f6d08a"/>
  <g fill="#e6ac62">
    <ellipse cx="62" cy="182" rx="9" ry="7"/><ellipse cx="86" cy="196" rx="8" ry="6"/>
    <ellipse cx="104" cy="178" rx="7" ry="6"/><ellipse cx="72" cy="204" rx="5" ry="4"/>
  </g>
  <!-- tail -->
  <path d="M123 186 q12 4 10 18" fill="none" stroke="#e6ac62" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="133" cy="206" r="4.5" fill="#b98455"/>

  <g class="head">
    <!-- neck -->
    <path d="M68 182 L 63 92 Q 80 84 97 92 L 94 182Z" fill="#f6d08a"/>
    <path d="M63 96 q-6 6 0 12 q-6 6 0 12 q-6 6 0 12 q-6 6 0 12 q-6 6 0 12" fill="none" stroke="#d99a50" stroke-width="5" stroke-linecap="round"/>
    <g fill="#e6ac62">
      <ellipse cx="80" cy="112" rx="7" ry="6"/><ellipse cx="88" cy="136" rx="6" ry="5"/>
      <ellipse cx="74" cy="152" rx="7" ry="6"/><ellipse cx="86" cy="166" rx="5" ry="4"/>
    </g>

    <!-- ossicones -->
    <g stroke="#e0a65c" stroke-width="6" stroke-linecap="round">
      <path d="M69 46 L 65 24"/><path d="M91 46 L 95 24"/>
    </g>
    <circle cx="65" cy="22" r="6" fill="#b98455"/><circle cx="95" cy="22" r="6" fill="#b98455"/>

    <!-- ears -->
    <ellipse cx="46" cy="56" rx="14" ry="7" fill="#f6d08a" transform="rotate(-20 46 56)"/>
    <ellipse cx="47" cy="56" rx="8" ry="3.5" fill="#f2b8b0" transform="rotate(-20 47 56)"/>
    <ellipse cx="114" cy="56" rx="14" ry="7" fill="#f6d08a" transform="rotate(20 114 56)"/>
    <ellipse cx="113" cy="56" rx="8" ry="3.5" fill="#f2b8b0" transform="rotate(20 113 56)"/>

    <!-- head -->
    <ellipse cx="80" cy="66" rx="31" ry="27" fill="#f6d08a"/>
    <ellipse cx="80" cy="84" rx="21" ry="14" fill="#fbe5bd"/>
    <circle cx="73" cy="82" r="2.2" fill="#b98455"/><circle cx="87" cy="82" r="2.2" fill="#b98455"/>
    <path d="M74 90 q6 5 12 0" fill="none" stroke="#b98455" stroke-width="2" stroke-linecap="round"/>

    <!-- sleepy happy eyes + cheeks -->
    <path d="M62 64 q6 6 12 0" fill="none" stroke="#4a4540" stroke-width="3" stroke-linecap="round"/>
    <path d="M86 64 q6 6 12 0" fill="none" stroke="#4a4540" stroke-width="3" stroke-linecap="round"/>
    <circle cx="58" cy="76" r="6" fill="#f2a9a0" opacity=".55"/>
    <circle cx="102" cy="76" r="6" fill="#f2a9a0" opacity=".55"/>
  </g>
</svg>
