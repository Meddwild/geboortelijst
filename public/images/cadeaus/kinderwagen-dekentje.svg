<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Kinderwagen met dekentje en speeltje">
  <!-- Example gift image (local file). Replace with your own photos in public/images/cadeaus/. -->
  <rect width="400" height="300" fill="#eef4e8"/>
  <ellipse cx="205" cy="282" rx="150" ry="10" fill="#000" opacity=".06"/>
  <!-- frame -->
  <g stroke="#6d6a66" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M150 210 L 135 252 M270 210 L 285 252"/>
    <path d="M300 160 L 345 82"/>
  </g>
  <rect x="330" y="70" width="34" height="14" rx="7" fill="#4a4743" transform="rotate(-58 347 77)"/>
  <!-- basket -->
  <path d="M86 150 Q 86 222 170 222 H 262 Q 306 222 306 168 V150Z" fill="#9cc287"/>
  <path d="M86 150 H306" stroke="#6f9d5f" stroke-width="6" stroke-linecap="round"/>
  <!-- hood -->
  <path d="M86 150 A 108 108 0 0 1 196 44 L 196 150Z" fill="#6f9d5f"/>
  <path d="M120 150 A 76 76 0 0 1 196 76 M154 150 A 42 42 0 0 1 196 108" fill="none" stroke="#9cc287" stroke-width="4" opacity=".55"/>
  <!-- blanket peeking out + hanging toy -->
  <path d="M200 150 Q 230 128 262 140 Q 290 132 306 150Z" fill="#f6d3d6"/>
  <g fill="#fff" opacity=".8"><circle cx="232" cy="141" r="3"/><circle cx="256" cy="139" r="3"/><circle cx="280" cy="143" r="3"/></g>
  <path d="M196 60 Q 230 64 250 92" fill="none" stroke="#a88a6a" stroke-width="2"/>
  <path d="M250 92 V112" stroke="#a88a6a" stroke-width="2"/>
  <path d="M250 112 l5 10 11 1 -8 8 2 11 -10 -5 -10 5 2 -11 -8 -8 11 -1z" fill="#f7d77a"/>
  <!-- wheels -->
  <g>
    <circle cx="135" cy="252" r="28" fill="#4a4743"/><circle cx="135" cy="252" r="12" fill="#cfcac3"/>
    <circle cx="285" cy="252" r="28" fill="#4a4743"/><circle cx="285" cy="252" r="12" fill="#cfcac3"/>
  </g>
</svg>